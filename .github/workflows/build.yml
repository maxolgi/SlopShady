name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # 1. Fast checks on every push / PR.
  #    SlopShady's build.rs links the QuicSRT C++ engine (emcc) and runs tsc
  #    on any cargo build, so this job needs emsdk + npm ci before the first
  #    cargo command that triggers build.rs (clippy/test — fmt doesn't build).
  # ---------------------------------------------------------------------------
  check:
    name: Lint + test + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # build.rs resolves emsdk via $EMSDK → ~/emsdk → PATH. 6.0.8 is the
      # toolchain the engine port was built against (matches upstream
      # QuicSRT-wasm CI).
      - name: Install Emscripten (emsdk 6.0.8)
        shell: bash
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install 6.0.8
          "$HOME/emsdk/emsdk" activate 6.0.8
          # Export a NATIVE path: bash's $HOME is POSIX-style (/c/...) on
          # Windows, which cargo/pwsh can't resolve — translate it there.
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "EMSDK=$(cygpath -w "$HOME/emsdk")" >> "$GITHUB_ENV"
          else
            echo "EMSDK=$HOME/emsdk" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: slopshady

      - name: Install Linux build deps (eframe/egui needs EGL/X11/Wayland headers)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl-dev libgl1-mesa-dev \
            libxcb1-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libxxf86vm-dev \
            libwayland-dev libxkbcommon-dev

      # fmt + clippy are advisory (no rustfmt.toml / clippy config in-repo).
      - name: cargo fmt --check
        working-directory: slopshady
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: cargo clippy
        working-directory: slopshady
        continue-on-error: true
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: slopshady
        run: cargo test --all-targets

      # Runs after the cargo steps so build.rs has generated static/{wasm,vendor}.
      - name: tsc typecheck
        run: npm run typecheck

  # ---------------------------------------------------------------------------
  # 2. Full build — Windows, macOS (ARM).
  #    build.rs embeds static/ via rust-embed at compile time; it also links
  #    the QuicSRT engine (emcc) and runs tsc, so emsdk + npm ci must precede
  #    the cargo build.
  #    (Linux builds in build-linux below.)
  # ---------------------------------------------------------------------------
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            binary: slopshady.exe
            artifact: slopshady-windows-x64
            staged: slopshady-windows-x64.exe
          - name: macOS ARM
            os: macos-latest
            binary: slopshady
            artifact: slopshady-macos-arm64
            staged: slopshady-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      # build.rs resolves emsdk via $EMSDK → ~/emsdk → PATH (Windows
      # launchers are <tool>.exe pylaunchers on emsdk >= 4, legacy
      # <tool>.bat below that). 6.0.8 matches upstream QuicSRT-wasm CI.
      - name: Install Emscripten (emsdk 6.0.8)
        shell: bash
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install 6.0.8
          "$HOME/emsdk/emsdk" activate 6.0.8
          # Export a NATIVE path: bash's $HOME is POSIX-style (/c/...) on
          # Windows, which cargo/pwsh can't resolve — translate it there.
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "EMSDK=$(cygpath -w "$HOME/emsdk")" >> "$GITHUB_ENV"
          else
            echo "EMSDK=$HOME/emsdk" >> "$GITHUB_ENV"
          fi

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: slopshady

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # Windows: build under an emsdk-activated environment so the pylauncher
      # .exe entry points build.rs spawns directly get canonical
      # EMSDK_PYTHON/EM_CONFIG and the em* tools on PATH. `call` (not a bare
      # invoke) so cmd returns control and runs cargo afterwards.
      - name: Build slopshady binary (Windows)
        if: runner.os == 'Windows'
        working-directory: slopshady
        shell: cmd
        run: call "%EMSDK%\emsdk_env.bat" && cargo build --release

      - name: Build slopshady binary
        if: runner.os != 'Windows'
        working-directory: slopshady
        run: cargo build --release

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p artifact
          cp "slopshady/target/release/${{ matrix.binary }}" "artifact/${{ matrix.staged }}"
          strip "artifact/${{ matrix.staged }}" || true

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: artifact/${{ matrix.staged }}
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 3. Linux build — Debian 13 (trixie) container, glibc 2.41.
  #    ubuntu-latest images carry a newer glibc (2.42), which would raise the
  #    binary's minimum requirement above Debian stable. Building inside
  #    debian:trixie caps it at glibc 2.41, and cargo-deb's $auto depends
  #    resolve against trixie's library versions. `container:` cannot be set
  #    conditionally from a matrix, hence a separate job.
  # ---------------------------------------------------------------------------
  build-linux:
    name: Build (Linux x64)
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      # Must precede checkout: git is not in the base image and checkout falls
      # back to a REST download (no submodules) without it.
      - name: Install build deps (Debian trixie)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git python3 xz-utils \
            build-essential cmake ninja-build pkg-config \
            libegl-dev libgl1-mesa-dev \
            libxcb1-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libxxf86vm-dev \
            libwayland-dev libxkbcommon-dev
          ldd --version | head -n 1

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # dtolnay/rust-toolchain assumes rustup is preinstalled (true on GH
      # runners, not in the bare container), so install rustup directly.
      - name: Install Rust (stable)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # build.rs resolves emsdk via $EMSDK → ~/emsdk → PATH. 6.0.8 is the
      # toolchain the engine port was built against (matches upstream
      # QuicSRT-wasm CI).
      - name: Install Emscripten (emsdk 6.0.8)
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install 6.0.8
          "$HOME/emsdk/emsdk" activate 6.0.8
          echo "EMSDK=$HOME/emsdk" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: slopshady

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Build slopshady binary
        working-directory: slopshady
        run: cargo build --release

      - name: Stage binary
        run: |
          mkdir -p artifact
          cp slopshady/target/release/slopshady artifact/slopshady-linux-x64
          strip artifact/slopshady-linux-x64

      - uses: actions/upload-artifact@v7
        with:
          name: slopshady-linux-x64
          path: artifact/slopshady-linux-x64
          if-no-files-found: error

      # .deb package (binary already built, --no-build skips rebuild). $auto
      # depends resolve against trixie via dpkg-shlibdeps (from build-essential).
      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      - name: Build .deb package
        working-directory: slopshady
        run: cargo deb --no-build

      - name: Upload .deb
        uses: actions/upload-artifact@v7
        with:
          name: slopshady-deb
          path: slopshady/target/debian/*.deb
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 4. Publish a GitHub Release for every successful build.
  #    - Push to main  → regular release tagged dev-<short_sha>, marked "latest"
  #    - v* tag push    → stable release tagged <version>, marked "latest"
  # ---------------------------------------------------------------------------
  release:
    name: Publish release
    needs: [build, build-linux]
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Stage release assets
        shell: bash
        run: |
          mkdir -p release
          cp artifacts/slopshady-linux-x64/* release/
          cp artifacts/slopshady-windows-x64/* release/
          cp artifacts/slopshady-macos-arm64/* release/
          cp artifacts/slopshady-deb/*.deb release/

      - name: Set release metadata
        id: meta
        env:
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
        run: |
          short="${SHA:0:7}"
          if [[ "$REF" == refs/tags/v* ]]; then
            echo "tag=${REF#refs/tags/}"    >> "$GITHUB_OUTPUT"
            echo "name=${REF#refs/tags/}"   >> "$GITHUB_OUTPUT"
            echo "prerelease=false"         >> "$GITHUB_OUTPUT"
            echo "make_latest=true"         >> "$GITHUB_OUTPUT"
          else
            echo "tag=dev-${short}"         >> "$GITHUB_OUTPUT"
            echo "name=Dev ${short}"        >> "$GITHUB_OUTPUT"
            echo "prerelease=false"         >> "$GITHUB_OUTPUT"
            echo "make_latest=true"         >> "$GITHUB_OUTPUT"
          fi

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          make_latest: ${{ steps.meta.outputs.make_latest }}
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
