name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # 1. Fast checks on every push / PR.
  #    SlopShady's build.rs builds WASM + runs tsc on any cargo build, so this
  #    job needs wasm-pack + npm ci (unlike a plain workspace). The build.rs
  #    env-sanitization prevents clippy's `-D warnings` from leaking into the
  #    wasm-pack subprocess.
  # ---------------------------------------------------------------------------
  check:
    name: Lint + test + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: slopshady

      - name: Install Linux build deps (eframe/egui needs EGL/X11/Wayland headers)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl-dev libgl1-mesa-dev \
            libxcb1-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libxxf86vm-dev \
            libwayland-dev libxkbcommon-dev

      # fmt + clippy are advisory (no rustfmt.toml / clippy config in-repo).
      - name: cargo fmt --check
        working-directory: slopshady
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: cargo clippy
        working-directory: slopshady
        continue-on-error: true
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: slopshady
        run: cargo test --all-targets

      # Runs after the cargo steps so build.rs has generated static/{wasm,vendor}.
      - name: tsc typecheck
        run: npm run typecheck

  # ---------------------------------------------------------------------------
  # 2. Full build — Linux, Windows, macOS (ARM).
  #    build.rs embeds static/ via rust-embed at compile time; it also builds
  #    the WASM crates and runs tsc, so wasm-pack + npm ci must precede it.
  # ---------------------------------------------------------------------------
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
            binary: slopshady
            artifact: slopshady-linux-x64
            staged: slopshady-linux-x64
          - name: Windows x64
            os: windows-latest
            binary: slopshady.exe
            artifact: slopshady-windows-x64
            staged: slopshady-windows-x64.exe
          - name: macOS ARM
            os: macos-latest
            binary: slopshady
            artifact: slopshady-macos-arm64
            staged: slopshady-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack (Unix)
        if: runner.os != 'Windows'
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install wasm-pack (Windows)
        if: runner.os == 'Windows'
        run: cargo install wasm-pack --locked

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: slopshady

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Install Linux build deps (eframe/egui needs EGL/X11/Wayland headers)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl-dev libgl1-mesa-dev \
            libxcb1-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libxxf86vm-dev \
            libwayland-dev libxkbcommon-dev

      - name: Build slopshady binary
        working-directory: slopshady
        run: cargo build --release

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p artifact
          cp "slopshady/target/release/${{ matrix.binary }}" "artifact/${{ matrix.staged }}"
          strip "artifact/${{ matrix.staged }}" || true

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: artifact/${{ matrix.staged }}
          if-no-files-found: error

      # .deb package — Linux only (binary already built, --no-build skips rebuild)
      - name: Install cargo-deb
        if: runner.os == 'Linux'
        run: cargo install cargo-deb --locked

      - name: Build .deb package
        if: runner.os == 'Linux'
        working-directory: slopshady
        run: cargo deb --no-build

      - name: Upload .deb
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: slopshady-deb
          path: slopshady/target/debian/*.deb
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 3. Publish a GitHub Release for every successful build.
  #    - Push to main  → prerelease tagged dev-<short_sha>
  #    - v* tag push    → stable release tagged <version>, marked "latest"
  # ---------------------------------------------------------------------------
  release:
    name: Publish release
    needs: build
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Stage release assets
        shell: bash
        run: |
          mkdir -p release
          cp artifacts/slopshady-linux-x64/* release/
          cp artifacts/slopshady-windows-x64/* release/
          cp artifacts/slopshady-macos-arm64/* release/
          cp artifacts/slopshady-deb/*.deb release/

      - name: Set release metadata
        id: meta
        env:
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
        run: |
          short="${SHA:0:7}"
          if [[ "$REF" == refs/tags/v* ]]; then
            echo "tag=${REF#refs/tags/}"    >> "$GITHUB_OUTPUT"
            echo "name=${REF#refs/tags/}"   >> "$GITHUB_OUTPUT"
            echo "prerelease=false"         >> "$GITHUB_OUTPUT"
            echo "make_latest=true"         >> "$GITHUB_OUTPUT"
          else
            echo "tag=dev-${short}"         >> "$GITHUB_OUTPUT"
            echo "name=Dev ${short}"        >> "$GITHUB_OUTPUT"
            echo "prerelease=true"          >> "$GITHUB_OUTPUT"
            echo "make_latest=false"        >> "$GITHUB_OUTPUT"
          fi

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          make_latest: ${{ steps.meta.outputs.make_latest }}
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
