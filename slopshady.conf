[program:slopshady]
command=/home/flibb/SlopShady/slopshady/target/release/slopshady --no-browser --port 8100 --data-dir /home/flibb/SlopShady --osc-port 8101 --osc-bind 0.0.0.0
directory=/home/flibb/SlopShady
autostart=true
autorestart=true
startretries=3
stderr_logfile=/home/flibb/SlopShady/logs/slopshady.err.log
stdout_logfile=/home/flibb/SlopShady/logs/slopshady.out.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=3
environment=RUST_LOG="info"
