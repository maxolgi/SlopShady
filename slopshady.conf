; Production supervisord config for the slopshady server (front.vyidd.com).
; Deploy: copy to /etc/supervisor/conf.d/slopshady.conf, then
;   supervisorctl reread && supervisorctl update && supervisorctl restart slopshady
;
; Local-only (bind 127.0.0.1) — nginx terminates TLS for slopshady.vyidd.com
; and proxies to :8100 (web) — and filters /api/* POST routes; only /ws and
; /api/stream/cert-hash are proxied. That path filtering is load-bearing
; security (the LLM proxy endpoints are an open relay if ever exposed).
; OSC bridge is bound to loopback only. Data dir: /var/lib/slopshady
; (shaders.json, self-signed cert/key live there).
[program:slopshady]
command=/opt/slopshady/slopshady --no-gui --bind 127.0.0.1 --port 8100 --osc-bind 127.0.0.1 --osc-port 8101 -d /var/lib/slopshady
directory=/var/lib/slopshady
user=www-data
autostart=true
autorestart=true
startretries=3
stdout_logfile=/var/log/slopshady/app.out.log
stderr_logfile=/var/log/slopshady/app.err.log
