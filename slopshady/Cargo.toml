[package]
name = "slopshady"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures = "0.3"
tokio-stream = "0.1"
rust-embed = "8"
mime_guess = "2"
axum-server = { version = "0.7", features = ["tls-rustls"] }
rcgen = "0.13"
open = "5"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4"] }
async-stream = "0.3"
base64 = "0.22"
bytes = "1"
url = "2"
rosc = "0.10"

[features]
default = ["webview"]
webview = ["dep:wry", "dep:tao", "dep:xcap", "dep:image", "dep:gtk"]

[dependencies.wry]
version = "0.55"
optional = true

[dependencies.tao]
version = "0.35"
optional = true

[dependencies.xcap]
version = "0.9"
optional = true

[dependencies.image]
version = "0.25"
optional = true

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", package = "gtk", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Security",
    "Win32_Foundation",
] }

[patch.crates-io]
wry = { path = "patches/wry" }

[build-dependencies]
winres = "0.1"
