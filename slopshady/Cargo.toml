[package]
name = "slopshady"
version = "0.1.0"
edition = "2021"
description = "Real-time WebGL2 GLSL shader editor with AI integration, multi-layer compositing, audio/MIDI modulation, and live streaming"
license = "AGPL-3.0-or-later"
repository = "https://github.com/maxolgi/SlopShady"
readme = "../README.md"
keywords = ["webgl2", "glsl", "shader", "vj", "visuals"]
categories = ["graphics", "multimedia::video", "rendering"]

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures = "0.3"
tokio-stream = "0.1"
rust-embed = "8"
mime_guess = "2"
axum-server = { version = "0.7", features = ["tls-rustls"] }
rcgen = "0.13"
open = "5"
clap = { version = "4", features = ["derive"] }
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"], optional = true }
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4"] }
async-stream = "0.3"
base64 = "0.22"
bytes = "1"
url = "2"
rosc = "0.10"
local-ip-address = "0.6"

[features]
default = ["gui"]
gui = ["dep:eframe"]

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
